<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Aspire Deploy</title>
    <script>
        // Theme: dark by default (docs/mockups/DESIGN.md); the top bar toggle remembers the choice.
        window.adsTheme = {
            get: function () { return document.documentElement.getAttribute('data-bs-theme') || 'dark'; },
            set: function (theme) {
                document.documentElement.setAttribute('data-bs-theme', theme);
                try { localStorage.setItem('ads-theme', theme); } catch (e) { }
                return theme;
            }
        };
        try {
            var saved = localStorage.getItem('ads-theme');
            if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-bs-theme', saved);
        } catch (e) { }
    </script>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="AspireDeployService.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        // DialogHost focus handling: remember the focused element, keep Tab inside the dialog, restore focus.
        window.adsFocus = {
            previous: null,
            save: function () { window.adsFocus.previous = document.activeElement; },
            restore: function () {
                var el = window.adsFocus.previous;
                window.adsFocus.previous = null;
                if (el && document.contains(el) && el.focus) el.focus();
            },
            cycle: function (first, last, backwards) {
                var active = document.activeElement;
                var next = backwards ? (active === first ? last : first) : (active === last ? first : last);
                setTimeout(function () { next.focus(); }, 0);
            }
        };
        // AI Help chat input: Enter sends, Shift+Enter is a new line. Blazor cannot decide preventDefault per key.
        window.adsChat = {
            enterToSend: function (textarea, dotNetRef) {
                if (!textarea || textarea.adsChatAttached) return;
                textarea.adsChatAttached = true;
                textarea.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                        e.preventDefault();
                        dotNetRef.invokeMethodAsync('SendFromKeyboard');
                    }
                });
            }
        };
        // Guide page: fragment links (guide#azure-resources) do not scroll by themselves in the Blazor WebView.
        window.adsGuide = {
            scrollTo: function (id) {
                var el = id && document.getElementById(id);
                if (el) el.scrollIntoView({ block: 'start' });
                return !!el;
            }
        };
        // Tab must not leave an open dialog: the default move is cancelled while one is shown.
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Tab' && document.querySelector('.ads-dialog')) e.preventDefault();
        }, true);
    </script>

</body>

</html>
